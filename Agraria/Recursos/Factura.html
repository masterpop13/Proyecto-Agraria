<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Factura</title>
    <style>
        body {
            font-family: Arial;
            font-size: 12px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 6px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .resumen {
            margin-top: 20px;
            text-align: right;
        }
    </style>
</head>
<body>
    <h2>Factura N° @NUMEROFACTURA</h2>
    <p><b>Cliente:</b> @CLIENTE</p>
    <p><b>CUIT:</b> @CUIT</p>
    <p><b>Fecha:</b> @FECHA</p>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unitario</th>
            </tr>
        </thead>
        <tbody>
            @FILAS
        </tbody>
    </table>

    <div class="resumen">
        <p><b>Subtotal:</b> $@PRECIO</p>
        <p><b>Descuento:</b> @DESCUENTO%</p>
        <p><b>Total:</b> $@TOTAL</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Reporte Colmenas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 50px;
        }

        th, td {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            font-size: 12px;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Reporte Colmenas - @NOMBREPAGINA - @FECHA</h2>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>F. Ingreso Colmenas</th>
                <th>Colmenas</th>
                <th>F. Ingreso Miel</th>
                <th>Cant. Miel</th>
                <th>F. Retiro Colmenas</th>
                <th>Colmenas Retiradas</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            @FILAS
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Producción Carne</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 50px;
        }

        th, td {
            border: 1px solid #000;
            padding: 6px;
            text-align: center;
            font-size: 12px;
        }

        th {
            background: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Producción Carne - @PAGINA - @FECHA</h2>
    <table>
        <thead>
            <tr>
                <th>Codigo de Registro</th>
                <th>Página</th>
                <th>Box</th>
                <th>N° Animal</th>
                <th>Ingreso</th>
                <th>Sexo</th>
                <th>Retiro</th>
                <th>Envío Ind.</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            @FILAS
        </tbody>
    </table>
</body>
</html>

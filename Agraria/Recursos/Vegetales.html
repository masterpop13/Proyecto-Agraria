<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Reporte Vegetales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px; /* más espacio entre título y tabla */
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 50px; /* 🔹 agrega separación con la imagen/logo */
        }

        th, td {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            font-size: 12px;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Reporte de Cosecha de Vegetales - @FECHA</h2>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Fecha Cultivo</th>
                <th>Fecha Cosecha</th>
                <th>Cant. Plantines</th>
                <th>Cant. Cosechada</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            @FILAS
        </tbody>
    </table>
</body>
</html>

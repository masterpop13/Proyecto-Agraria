<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Reporte de Nacimientos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 50px;
        }

        th, td {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            font-size: 12px;
        }

        th {
            background-color: #f2f2f2;
        }

        img.logo {
            width: 70px;
            position: absolute;
            left: 40px;
            top: 30px;
        }
    </style>
</head>
<body>
    <img src="../Recursos/logo.png" class="logo" alt="Logo Agraria" />
    <h2>Reporte de Nacimientos - @FECHA</h2>
    <h3 style="text-align:center;">@NOMBREPAGINA</h3>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>N° Madre</th>
                <th>N° Padre</th>
                <th>Fecha Monta</th>
                <th>Fecha Parto</th>
                <th>Tipo Animal</th>
                <th>Cant. Hembras</th>
                <th>Cant. Machos</th>
                <th>Total Nacidos</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            @FILAS
        </tbody>
    </table>
</body>
</html>
